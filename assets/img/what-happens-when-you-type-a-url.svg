<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="A browser address bar above a pipeline of five steps: DNS, TCP, TLS, HTTP and render">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f1a30"/></linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#1f2a3d"/></pattern>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>
  <!-- browser bar -->
  <g font-family="ui-monospace,Consolas,monospace">
    <rect x="200" y="70" width="800" height="90" rx="20" fill="#121826" stroke="#1f2937" stroke-width="3"/>
    <circle cx="240" cy="115" r="9" fill="#f87171"/><circle cx="268" cy="115" r="9" fill="#fbbf24"/><circle cx="296" cy="115" r="9" fill="#34d399"/>
    <rect x="330" y="92" width="640" height="46" rx="23" fill="#0b0f17"/>
    <path d="M356 118 v-6 a7 7 0 0 1 14 0 v6 M352 117 h22 v14 h-22z" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <text x="390" y="124" fill="#e5e7eb" font-size="24">https://example.com</text>
    <rect x="652" y="102" width="3" height="28" fill="#22d3ee"/>
  </g>
  <path d="M130 360 H1070" stroke="url(#line)" stroke-width="5" stroke-dasharray="14 10"/>
  <g font-family="ui-monospace,Consolas,monospace" text-anchor="middle">
    <g transform="translate(150 360)"><circle r="62" fill="#121826" stroke="#22d3ee" stroke-width="5"/><text y="10" fill="#22d3ee" font-size="28" font-weight="700">DNS</text><text y="110" fill="#9ca3af" font-size="20">name → IP</text></g>
    <g transform="translate(375 360)"><circle r="62" fill="#121826" stroke="#38bdf8" stroke-width="5"/><text y="10" fill="#38bdf8" font-size="28" font-weight="700">TCP</text><text y="110" fill="#9ca3af" font-size="20">handshake</text></g>
    <g transform="translate(600 360)"><circle r="62" fill="#121826" stroke="#34d399" stroke-width="5"/><text y="10" fill="#34d399" font-size="28" font-weight="700">TLS</text><text y="110" fill="#9ca3af" font-size="20">encrypt</text></g>
    <g transform="translate(825 360)"><circle r="62" fill="#121826" stroke="#fbbf24" stroke-width="5"/><text y="10" fill="#fbbf24" font-size="28" font-weight="700">HTTP</text><text y="110" fill="#9ca3af" font-size="20">GET /</text></g>
    <g transform="translate(1050 360)"><circle r="62" fill="#121826" stroke="#a78bfa" stroke-width="5"/><path d="M-26 -22 h52 v40 h-52z M-26 -10 h52" fill="none" stroke="#a78bfa" stroke-width="4"/><text y="110" fill="#9ca3af" font-size="20">render</text></g>
  </g>
</svg>
