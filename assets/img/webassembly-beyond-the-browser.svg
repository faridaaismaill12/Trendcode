<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="A WebAssembly module inside a dashed sandbox, connected to a browser, an edge network, a server and a plugin host">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#151a33"/></linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#1f2a3d"/></pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a78bfa" stop-opacity=".4"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>
  <g stroke="#22d3ee" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round">
    <path d="M600 300 L240 150"/><path d="M600 300 L960 150"/><path d="M600 300 L240 450"/><path d="M600 300 L960 450"/>
  </g>
  <circle cx="600" cy="300" r="220" fill="url(#glow)"/>
  <rect x="440" y="170" width="320" height="260" rx="30" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="600" y="160" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace,Consolas,monospace" font-size="20">sandbox</text>
  <g transform="translate(600 300)">
    <rect x="-100" y="-90" width="200" height="180" rx="22" fill="#654ff0"/>
    <path d="M-40 -90 a40 40 0 0 0 80 0" fill="#0b1220"/>
    <text y="58" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,system-ui,sans-serif" font-weight="700" font-size="46">WA</text>
  </g>
  <g font-family="ui-monospace,Consolas,monospace" font-size="22" fill="#e5e7eb" text-anchor="middle">
    <g transform="translate(240 150)"><rect x="-110" y="-50" width="220" height="100" rx="18" fill="#121826" stroke="#1f2937" stroke-width="3"/><rect x="-90" y="-34" width="180" height="16" rx="8" fill="#1f2937"/><text y="30">browser</text></g>
    <g transform="translate(960 150)"><rect x="-110" y="-50" width="220" height="100" rx="18" fill="#121826" stroke="#1f2937" stroke-width="3"/><path d="M-30 -10 q0 -26 30 -26 q24 0 28 20 q22 2 22 20 q0 18 -22 18 h-56 q-22 0 -22 -16 q0 -16 20 -16z" fill="none" stroke="#22d3ee" stroke-width="3" transform="translate(0 -6) scale(.7)"/><text y="34">edge</text></g>
    <g transform="translate(240 450)"><rect x="-110" y="-50" width="220" height="100" rx="18" fill="#121826" stroke="#1f2937" stroke-width="3"/><rect x="-40" y="-34" width="80" height="18" rx="4" fill="none" stroke="#22d3ee" stroke-width="3"/><rect x="-40" y="-10" width="80" height="18" rx="4" fill="none" stroke="#22d3ee" stroke-width="3"/><text y="36">server</text></g>
    <g transform="translate(960 450)"><rect x="-110" y="-50" width="220" height="100" rx="18" fill="#121826" stroke="#1f2937" stroke-width="3"/><path d="M-20 -36 h40 v12 h12 v24 h-12 v12 h-40z" fill="none" stroke="#22d3ee" stroke-width="3"/><text y="36">plugins</text></g>
  </g>
</svg>
