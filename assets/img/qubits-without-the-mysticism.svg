<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="A Bloch sphere with a qubit state vector, beside bars showing the amplitudes for 0 and 1">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101d33"/></linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#1f2a3d"/></pattern>
    <radialGradient id="sph" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".02"/></radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>
  <g transform="translate(420 300)" font-family="ui-monospace,Consolas,monospace">
    <circle r="220" fill="url(#sph)" stroke="#22d3ee" stroke-width="3"/>
    <path d="M-220 0 A220 62 0 0 1 220 0" fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-width="2" stroke-dasharray="8 8"/>
    <path d="M-220 0 A220 62 0 0 0 220 0" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
    <path d="M0 -250 V250" stroke="#4b5563" stroke-width="2"/>
    <path d="M-250 30 L250 -30" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 6"/>
    <text x="14" y="-232" fill="#e5e7eb" font-size="30">|0⟩</text>
    <text x="14" y="262" fill="#e5e7eb" font-size="30">|1⟩</text>
    <path d="M0 0 L135 -150" stroke="#a78bfa" stroke-width="7" marker-end="url(#ar)"/>
    <path d="M135 -150 L135 -38" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 6" opacity=".7"/>
    <path d="M0 -70 A70 70 0 0 1 47 -52" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <text x="22" y="-86" fill="#fbbf24" font-size="24">θ</text>
    <circle r="8" fill="#e5e7eb"/>
    <circle cx="140" cy="-156" r="12" fill="#a78bfa"/>
  </g>
  <g font-family="ui-monospace,Consolas,monospace" font-size="24" fill="#9ca3af">
    <text x="780" y="200">α  |0⟩</text>
    <rect x="780" y="215" width="300" height="34" rx="8" fill="#1f2937"/>
    <rect x="780" y="215" width="250" height="34" rx="8" fill="#22d3ee"/>
    <text x="780" y="320">β  |1⟩</text>
    <rect x="780" y="335" width="300" height="34" rx="8" fill="#1f2937"/>
    <rect x="780" y="335" width="165" height="34" rx="8" fill="#a78bfa"/>
    <text x="780" y="440" fill="#e5e7eb">|ψ⟩ = α|0⟩ + β|1⟩</text>
  </g>
</svg>
