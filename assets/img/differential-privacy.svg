<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="A crowd of people icons with one highlighted individual, feeding a bar chart whose bars have small random noise added">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#1a1530"/></linearGradient>
    <pattern id="people" width="56" height="64" patternUnits="userSpaceOnUse"><circle cx="28" cy="20" r="9" fill="#374151"/><path d="M12 52 a16 16 0 0 1 32 0z" fill="#374151"/></pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fbbf24" stop-opacity=".45"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect x="60" y="90" width="448" height="448" rx="24" fill="url(#people)"/>
  <circle cx="312" cy="296" r="70" fill="url(#glow)"/>
  <g transform="translate(284 276)"><circle cx="28" cy="20" r="9" fill="#fbbf24"/><path d="M12 52 a16 16 0 0 1 32 0z" fill="#fbbf24"/></g>
  <!-- noise cloud -->
  <g filter="url(#blur)" opacity=".55">
    <circle cx="610" cy="300" r="60" fill="#a78bfa"/><circle cx="650" cy="260" r="40" fill="#22d3ee"/>
  </g>
  <text x="630" y="308" text-anchor="middle" fill="#e5e7eb" font-family="ui-monospace,Consolas,monospace" font-size="30" font-weight="700">+ noise</text>
  <path d="M520 310 H560" stroke="#9ca3af" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M700 310 H740" stroke="#9ca3af" stroke-width="3" marker-end="url(#ar)"/>
  <!-- noisy bar chart -->
  <g>
    <path d="M770 520 H1140" stroke="#4b5563" stroke-width="3"/>
    <g fill="#22d3ee"><rect x="790" y="300" width="60" height="220" rx="6"/><rect x="880" y="200" width="60" height="320" rx="6"/><rect x="970" y="350" width="60" height="170" rx="6"/><rect x="1060" y="250" width="60" height="270" rx="6"/></g>
    <g stroke="#fbbf24" stroke-width="4" stroke-linecap="round">
      <path d="M820 278 V322 M806 278 h28 M806 322 h28"/><path d="M910 178 V222 M896 178 h28 M896 222 h28"/>
      <path d="M1000 328 V372 M986 328 h28 M986 372 h28"/><path d="M1090 228 V272 M1076 228 h28 M1076 272 h28"/>
    </g>
    <text x="955" y="150" text-anchor="middle" fill="#9ca3af" font-family="ui-monospace,Consolas,monospace" font-size="24">ε = 0.5</text>
  </g>
</svg>
